---
- name: Configure Amazon Linux and deploy website
  hosts: web
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for SSH and Python
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Collect host facts
      ansible.builtin.setup:
  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
    - name: Copy website
      ansible.builtin.copy:
        src: ../app/index.html
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: '0644'
    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
    - name: Verify application locally on server
      ansible.builtin.uri:
        url: http://127.0.0.1/
        return_content: true
      register: response
      retries: 5
      delay: 3
      until: response.status == 200 and 'AWS DevOps Demo' in response.content
